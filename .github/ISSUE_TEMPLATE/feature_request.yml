name: Feature request
description: Propose a focused improvement or provider
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not currently met?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the experience and which workspace it likely affects.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and permissions
      description: Note new data, permissions, credentials, network origins, or bridge behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
